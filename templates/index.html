<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AliGyn BOUTIQUE | Asesora de estilo</title>
    <style>
        :root {
            --oliva: #85896f;
            --oliva-oscuro: #555b43;
            --oliva-palido: #eef0e7;
            --crema: #f7f5ef;
            --beige: #e7e2d5;
            --tinta: #33352e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            color: var(--tinta);
            background: var(--crema);
            font: 15px/1.5 "Segoe UI", sans-serif;
        }
        button, input { font: inherit; }
        .escaparate {
            display: grid;
            grid-template-columns: .9fr 1.1fr;
            width: min(100%, 970px);
            height: min(760px, calc(100vh - 2.5rem));
            min-height: 650px;
            overflow: hidden;
            border: 1px solid var(--beige);
            border-radius: 24px;
            background: #fffefa;
            box-shadow: 0 24px 70px #34392a1c;
        }
        .portada {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            color: #f8f6ef;
            background: linear-gradient(155deg, #747960, #898b72 58%, #a1a08a);
        }
        .portada::before, .portada::after {
            position: absolute;
            z-index: -1;
            content: "";
            border: 1px solid #f1eedb38;
            border-radius: 50%;
            pointer-events: none;
        }
        .portada::before { width: 350px; height: 350px; top: 21%; left: 7%; }
        .portada::after { width: 250px; height: 250px; right: -120px; bottom: -30px; }
        .marca { position: relative; z-index: 1; display: flex; align-items: center; gap: .8rem; font-size: 1rem; letter-spacing: .14em; }
        .sello {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            place-items: center;
            border: 1px solid #f2efdcaa;
            border-radius: 50%;
            font-family: Georgia, serif;
            font-size: 1.18rem;
            letter-spacing: -.13em;
        }
        .sello span + span { margin-left: -.18rem; font-size: .92em; }
        .marca strong { display: block; margin-top: .12rem; font-size: .68rem; font-weight: 400; letter-spacing: .31em; }
        .portada-centro {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .9rem;
            margin: 1rem 0;
            text-align: center;
        }
        .frase { margin: 0; font: 400 clamp(2.1rem, 4vw, 3rem)/1.08 Georgia, serif; letter-spacing: .01em; }
        .frase em { color: #ede8d5; font-weight: 400; }
        .ilustracion { width: min(100%, 250px); height: 260px; }
        .ilustracion svg { display: block; width: 100%; height: 100%; overflow: visible; }
        .aureola { fill: none; stroke: #f1eedb66; stroke-width: 1; }
        .prenda { fill: #f2eddb16; stroke: #f5f1e5; stroke-width: 1.5; stroke-linejoin: round; }
        .detalle { fill: none; stroke: #e3dfca; stroke-width: 1.2; stroke-linecap: round; }
        .flor { fill: #e3dfca; opacity: .8; }
        .conversacion { display: flex; min-width: 0; min-height: 0; flex-direction: column; padding: 1.25rem; }
        .chat-cabecera {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: .25rem .25rem 1rem;
            border-bottom: 1px solid #ece9df;
        }
        .avatar {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border-radius: 50%;
            background: var(--oliva-palido);
            color: var(--oliva-oscuro);
            font-size: 1.3rem;
        }
        .chat-cabecera strong, .chat-cabecera small { display: block; }
        .chat-cabecera small { margin-top: .15rem; color: #74776c; }
        .estado { margin-left: auto; color: var(--oliva-oscuro); font-size: .75rem; }
        .punto { display: inline-block; width: 8px; height: 8px; margin-right: .25rem; border-radius: 50%; background: #899274; }
        #mensajes {
            display: flex;
            height: 230px;
            min-height: 0;
            max-height: 230px;
            flex: 0 0 230px;
            flex-direction: column;
            gap: .75rem;
            overflow-y: auto;
            padding: 1.25rem .2rem;
            scrollbar-color: var(--oliva) var(--crema);
            scrollbar-width: thin;
        }
        #mensajes::-webkit-scrollbar { width: 8px; }
        #mensajes::-webkit-scrollbar-thumb { border-radius: 8px; background: var(--oliva); }
        #mensajes::-webkit-scrollbar-track { background: var(--crema); }
        .mensaje { max-width: 88%; flex: 0 0 auto; margin: 0; padding: .75rem .9rem; border-radius: 16px; }
        .bot { align-self: flex-start; border: 1px solid #ece9df; border-bottom-left-radius: 4px; background: #fffefa; }
        .usuario { align-self: flex-end; border-bottom-right-radius: 4px; background: var(--oliva-palido); }
        .ayuda { margin: 0 0 .45rem; color: #74776c; font-size: .78rem; }
        .preguntas { display: flex; flex-wrap: wrap; gap: .45rem; padding-bottom: 1rem; }
        .pregunta {
            padding: .42rem .65rem;
            border: 1px solid #d6d5c7;
            border-radius: 18px;
            background: transparent;
            color: var(--oliva-oscuro);
            cursor: pointer;
            font-size: .76rem;
        }
        .pregunta:hover { background: var(--oliva-palido); }
        form { display: flex; gap: .55rem; padding-top: .85rem; border-top: 1px solid #ece9df; }
        input {
            min-width: 0;
            flex: 1;
            padding: .75rem .9rem;
            border: 1px solid #dcd9ce;
            border-radius: 22px;
            outline-color: var(--oliva);
            background: #fff;
        }
        #enviar {
            padding: .7rem 1rem;
            border: 0;
            border-radius: 22px;
            background: var(--oliva-oscuro);
            color: white;
            cursor: pointer;
        }
        #enviar:disabled { opacity: .6; cursor: wait; }
        #error { min-height: 1.3rem; padding: .3rem .2rem 0; color: #8a5148; font-size: .8rem; }
        @media (max-width: 700px) {
            body { padding: .6rem; }
            .escaparate { height: auto; grid-template-columns: 1fr; min-height: calc(100vh - 1.2rem); }
            .portada { padding: 1.35rem; }
            .portada-centro { gap: .5rem; margin: .8rem 0; }
            .frase { font-size: 2rem; }
            .ilustracion { width: 165px; height: 150px; }
            .conversacion { min-height: 480px; padding: 1rem; }
        }
    </style>
</head>
<body>
    <main class="escaparate">
        <aside class="portada">
            <div class="marca">
                <span class="sello"><span>A</span><span>G</span></span>
                <span>AliGyn<strong>BOUTIQUE</strong></span>
            </div>
            <div class="portada-centro">
                <p class="frase">Tu estilo,<br><em>tu esencia.</em></p>
                <div class="ilustracion" aria-hidden="true">
                    <svg viewBox="0 0 250 260" role="img">
                        <circle class="aureola" cx="125" cy="130" r="108"></circle>
                        <path class="prenda" d="M94 71 72 91l24 28-23 94h104l-23-94 24-28-22-20-22 20h-18z"></path>
                        <path class="detalle" d="M94 71c3 22 17 34 31 34s28-12 31-34M125 106v106M90 154c22 8 48 8 70 0"></path>
                        <path class="detalle" d="M47 72c11-10 22-10 31 0-9 10-20 10-31 0zm15-16v32"></path>
                        <path class="detalle" d="M187 178c11-10 22-10 31 0-9 10-20 10-31 0zm15-16v32"></path>
                        <circle class="flor" cx="62" cy="72" r="2.5"></circle>
                        <circle class="flor" cx="202" cy="178" r="2.5"></circle>
                    </svg>
                </div>
            </div>
        </aside>

        <section class="conversacion" aria-label="Chat de AliGyn BOUTIQUE">
            <header class="chat-cabecera">
                <span class="avatar">✿</span>
                <div><strong>Asesora AliGyn</strong><small>Estoy aquí para ayudarte</small></div>
                <span class="estado"><span class="punto"></span>En línea</span>
            </header>
            <section id="mensajes" aria-live="polite" aria-label="Conversación">
                <p class="mensaje bot">¡Hola! Soy la asesora de AliGyn BOUTIQUE. Puedo ayudarte con tallas, prendas, pagos y envíos. ¿Qué te gustaría saber?</p>
            </section>
            <p class="ayuda">Preguntas frecuentes</p>
            <div class="preguntas">
                <button class="pregunta" type="button" data-pregunta="¿Qué prendas venden?">Prendas</button>
                <button class="pregunta" type="button" data-pregunta="¿Qué tallas manejan?">Tallas</button>
                <button class="pregunta" type="button" data-pregunta="¿Tienen otros colores?">Colores</button>
                <button class="pregunta" type="button" data-pregunta="¿Hay promociones?">Promociones</button>
                <button class="pregunta" type="button" data-pregunta="¿Qué métodos de pago aceptan?">Pagos</button>
                <button class="pregunta" type="button" data-pregunta="¿Hacen envíos?">Envíos</button>
                <button class="pregunta" type="button" data-pregunta="¿Cuánto cuesta el envío?">Costo de envío</button>
                <button class="pregunta" type="button" data-pregunta="¿Cuánto tarda mi pedido?">Entrega</button>
                <button class="pregunta" type="button" data-pregunta="¿Puedo cambiar una prenda?">Cambios</button>
                <button class="pregunta" type="button" data-pregunta="¿Cómo reviso mi pedido?">Pedidos</button>
                <button class="pregunta" type="button" data-pregunta="¿Cuál es su horario?">Horario</button>
                <button class="pregunta" type="button" data-pregunta="¿Dónde están ubicados?">Ubicación</button>
                <button class="pregunta" type="button" data-pregunta="¿Cómo debo lavar mi ropa?">Cuidados</button>
                <button class="pregunta" type="button" data-pregunta="¿Cuánto cuesta una prenda?">Precios</button>
            </div>
            <form id="formulario">
                <input id="mensaje" name="mensaje" type="text" placeholder="Escribe tu pregunta..." autocomplete="off" required aria-label="Escribe tu pregunta">
                <button id="enviar" type="submit">Enviar</button>
            </form>
            <div id="error" role="status"></div>
        </section>
    </main>
    <script>
        const formulario = document.querySelector("#formulario");
        const entrada = document.querySelector("#mensaje");
        const conversacion = document.querySelector("#mensajes");
        const boton = document.querySelector("#enviar");
        const error = document.querySelector("#error");

        function agregarMensaje(texto, clase) {
            const elemento = document.createElement("p");
            elemento.className = `mensaje ${clase}`;
            elemento.textContent = texto;
            conversacion.append(elemento);
            conversacion.scrollTop = conversacion.scrollHeight;
        }

        async function enviarMensaje(texto) {
            const mensaje = texto.trim();
            if (!mensaje) return;

            agregarMensaje(mensaje, "usuario");
            entrada.value = "";
            error.textContent = "";
            boton.disabled = true;
            try {
                const respuesta = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ mensaje })
                });
                if (!respuesta.ok) throw new Error("No se pudo obtener una respuesta.");
                const datos = await respuesta.json();
                agregarMensaje(datos.respuesta, "bot");
            } catch (e) {
                error.textContent = "No se pudo conectar con la tienda. Intenta de nuevo.";
            } finally {
                boton.disabled = false;
                entrada.focus();
            }
        }

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();
            enviarMensaje(entrada.value);
        });

        const preguntas = document.querySelectorAll(".pregunta");
        preguntas.forEach(function(pregunta) {
            pregunta.addEventListener("click", function() {
                enviarMensaje(pregunta.dataset.pregunta);
            });
        });
    </script>
</body>
</html>
